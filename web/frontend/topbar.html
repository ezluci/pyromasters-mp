<div id="topbar">
    <div id="topbar-inner">
        <div id="topbar-logo">
            <a href="/">goto index</a>
        </div>

    {{ if not .CurrentUser }}
        <div id="login-div">
            <span id="login-header">LOGIN:</span>
            <label>username</label>
            <input type="text" id="login-username" data-enter-target="login-button">
            <label>password</label>
            <input type="password" id="login-password" data-enter-target="login-button">
            <button type="submit" id="login-button">login</button>
            <a href="#" id="goto-register">dont have an account?</a>
        </div>
        <div id="register-div">
            <span id="register-header">REGISTER:</span>
            <label>username</label>
            <input type="text" id="register-username" data-enter-target="register-button">
            <label>password</label>
            <input type="password" id="register-password" data-enter-target="register-button">
            <button type="submit" id="register-button">register</button>
            <a href="#" id="goto-login">already have an account?</a>
        </div>
    {{ else }}
        <div id="topbar-profile">
            <b>welcome {{ .CurrentUser.Username }}!</b>
            <a href="/profile">your profile</a>
            <a href="#" id="logout">logout</a>
        </div>
    {{ end }}
    </div>
</div>
