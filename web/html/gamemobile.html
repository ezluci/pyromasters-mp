<!DOCTYPE html>
<html lang="en-us">
<head>
   <meta charset="UTF-8">
   
   <title>pyromasters-mp - GameMobile.html</title>
   <link rel="icon" href="favicon.ico">

   <link rel="stylesheet" href="css/GameMobile.css">
   
   <script src="socket.io/socket.io.min.js"></script>
   <script src="howler.js/howler.js"></script>

   <script src="js/misc.js"></script>
   <script src="js/log.js"></script>

   <script>
      const DEFAULT_VOLUME = 20;

      const params = new URLSearchParams(window.location.search);
      const usernameHTML = params.get('username');
      const roomHTML = params.get('room');
   </script>

   <!-- LOADING ASSETS -->
   <script src="js/game/load-assets.js"></script>
   <script src="js/game/animations/load-animations.js"></script>
   <script src="js/game/animations/process-animations.js"></script>

   <script src="js/game/index.js"></script>
   <script src="js/game/misc.js"></script>
   <script src="js/game/consts.js"></script>
   <script src="js/game/game-socket.js"></script>
   <script src="js/game/movement.js"></script>
</head>

<body tabindex="-1">
   <main>
      <div class="sidebar_left">

         <div id="log">
            <div id="log-messages"></div>

            <input id="chat-input">
            <button id="chat-send-message" onclick="socket.emit('chat', chatInput.value); chatInput.value = '';">Send msg</button>

            <script>
               const chatInput = document.querySelector('#chat-input');
               chatInput.value = '';
               addLog('please rotate your device in landscape mode.')
            </script>
         </div>

         <div id="select-color" style="color: black; font-weight: bold;" hidden>
            <u><b><i>
               <span style="color: red;">Select</span>
               <span style="color: aqua;">color</span>
               <span style="color: blue;">here:</span></i></b></u><br>
            <button id="white" class="color-button" onclick="socket.emit('selectColor', 'white')">WHITE</button>
            <button id="black" class="color-button" onclick="socket.emit('selectColor', 'black')">BLACK</button>
            <button id="orange" class="color-button" onclick="socket.emit('selectColor', 'orange')">ORANGE</button>
            <button id="green" class="color-button" onclick="socket.emit('selectColor', 'green')">GREEN</buttton>
            <button id="spectator" class="color-button" onclick="socket.emit('selectColor', null)">SPECTATOR</buttton>
         </div>

         <div id="select-map" hidden>
            <b><i>
               Select map here (owner only):
            </i></b>
            <select id="map-selected">
               <option value="random" selected>Random map</option>
               <option value="bricktown">Bricktown</option>
               <option value="fourway">Fourway</option>
               <option value="magneto">Magneto</option>
            </select>
         </div>

         <div id="powerups" hidden style="visibility: hidden; display: none;">
            <div id="powerups-white">
               <div>
                  <img class="powerup-image-full" src="assets/images/players/white.png">
               </div>
               <div id="powerups-white-bomblength">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bomblength.png">
                  <br><span class="powerup-text">2</span>
               </div>
               <div id="powerups-white-bombtime">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bombtime.png">
                  <br><span class="powerup-text">4s</span>
               </div>
               <div id="powerups-white-speed">
                  <img class="powerup-image-up" src="assets/images/blocks/power_speed.png">
                  <br><span class="powerup-text">LOW</span>
               </div>
               <div id="powerups-white-kickbomb" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/power_kickbombs.png">
               </div>
               <div id="powerups-white-bomb1">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-white-bomb2" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-white-bomb3" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-white-bomb4" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
            </div>
            <div id="powerups-black">
               <div>
                  <img class="powerup-image-full" src="assets/images/players/black.png">
               </div>
               <div id="powerups-black-bomblength">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bomblength.png">
                  <br><span class="powerup-text">2</span>
               </div>
               <div id="powerups-black-bombtime">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bombtime.png">
                  <br><span class="powerup-text">4s</span>
               </div>
               <div id="powerups-black-speed">
                  <img class="powerup-image-up" src="assets/images/blocks/power_speed.png">
                  <br><span class="powerup-text">LOW</span>
               </div>
               <div id="powerups-black-kickbomb" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/power_kickbombs.png">
               </div>
               <div id="powerups-black-bomb1">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-black-bomb2" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-black-bomb3" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-black-bomb4" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
            </div>
            <div id="powerups-orange">
               <div>
                  <img class="powerup-image-full" src="assets/images/players/orange.png">
               </div>
               <div id="powerups-orange-bomblength">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bomblength.png">
                  <br><span class="powerup-text">2</span>
               </div>
               <div id="powerups-orange-bombtime">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bombtime.png">
                  <br><span class="powerup-text">4s</span>
               </div>
               <div id="powerups-orange-speed">
                  <img class="powerup-image-up" src="assets/images/blocks/power_speed.png">
                  <br><span class="powerup-text">LOW</span>
               </div>
               <div id="powerups-orange-kickbomb" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/power_kickbombs.png">
               </div>
               <div id="powerups-orange-bomb1">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-orange-bomb2" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-orange-bomb3" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-orange-bomb4" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
            </div>
            <div id="powerups-green">
               <div>
                  <img class="powerup-image-full" src="assets/images/players/green.png">
               </div>
               <div id="powerups-green-bomblength">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bomblength.png">
                  <br><span class="powerup-text">2</span>
               </div>
               <div id="powerups-green-bombtime">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bombtime.png">
                  <br><span class="powerup-text">4s</span>
               </div>
               <div id="powerups-green-speed">
                  <img class="powerup-image-up" src="assets/images/blocks/power_speed.png">
                  <br><span class="powerup-text">LOW</span>
               </div>
               <div id="powerups-green-kickbomb" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/power_kickbombs.png">
               </div>
               <div id="powerups-green-bomb1">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-green-bomb2" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-green-bomb3" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-green-bomb4" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
            </div>
         </div>
      </div>


      <span id="loading" style="font-size: large; font-weight: bold;"></span>
      <script>
         document.querySelector('#loading').innerText = `Loading assets 0/${ASSETS_COUNT}...`;
      </script>
      <canvas id="canvas" width="815" height="620"></canvas>


      <div class="sidebar_right">
         <div id="start-game">
            <button id="start-button" onclick="
               if (usernameHTML === 'testmap:)') {
                  socket.emit('tryStart', 'testmap:)');
               } else {
                  socket.emit('tryStart', document.querySelector('#map-selected').value);
               }
            ">Start game</button>
            <br>
            <span id="room-status" style="color: red;"></span>
         </div>

         <ul id="player-list" style="display: inline-block; background-color: #bfb4b4; padding-top: 5px; padding-bottom: 5px; padding-right: 5px; font-size: 20px;"></ul>

         <br>
         <button id="button-up" class="android-button">^</button>
         <br>
         <button id="button-left" class="android-button"><</button>
         <button id="button-bomb" class="android-button">BOMB</button>
         <button id="button-right" class="android-button">></button>
         <br>
         <button id="button-down" class="android-button">v</button>
      </div>
   </main>

   <script src="js/game/game.js"></script>
   <script src="js/game/record-keys-phone.js"></script>

   {{ template "footer.html" . }}
</body>
</html>
