<!DOCTYPE html>
<html lang="en-us">

<head>
   <meta charset="UTF-8">
   <link rel="icon" href="favicon.ico">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>pyromasters-mp - GameMobile</title>
   <link rel="stylesheet" href="css/GameMobile.css">
   <script type="module" src="src/index.ts"></script>

   <script>
      function setViewportHeight() {
         const vh = window.innerHeight * 0.01;
         document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
   </script>
</head>

<body tabindex="-1">
   <span id="loading" style="font-size: large; font-weight: bold;"></span>
   
   <div id="main">
      <div id="sidebar-left">

         <div id="log">
            <div id="log-messages"></div>
            <div id="log-buttons">
               <input id="chat-input">
               <button id="chat-send-message">Send</button>
            </div>
         </div>

         <div id="select-color" hidden>
            <b><i>
               <span style="color: red;">Select</span>
               <span style="color: aqua;">color</span>
               <span style="color: blue;">here:</span>
            </i></b>
            <br>
            <button id="white" class="color-button">WHITE</button>
            <button id="black" class="color-button">BLACK</button>
            <button id="orange" class="color-button">ORANGE</button>
            <button id="green" class="color-button">GREEN</buttton>
            <button id="spectator" class="color-button">SPECTATOR</buttton>
         </div>

         <div id="select-map" hidden>
            <b><i>
               Select map (owner only):
            </i></b>
            <select id="map-selected">
               <option value="random" selected>Random map</option>
               <option value="bricktown">Bricktown</option>
               <option value="fourway">Fourway</option>
               <option value="magneto">Magneto</option>
            </select>
         </div>

         <div id="powerups" hidden>
            <div id="powerups-white">
               <div>
                  <img class="powerup-image-full" src="assets/images/players/white.png">
               </div>
               <div id="powerups-white-bomblength">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bomblength.png">
                  <br><span class="powerup-text">2</span>
               </div>
               <div id="powerups-white-bombtime">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bombtime.png">
                  <br><span class="powerup-text">4s</span>
               </div>
               <div id="powerups-white-speed">
                  <img class="powerup-image-up" src="assets/images/blocks/power_speed.png">
                  <br><span class="powerup-text">LOW</span>
               </div>
               <div id="powerups-white-kickbomb" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/power_kickbombs.png">
               </div>
               <div id="powerups-white-bomb1">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-white-bomb2" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-white-bomb3" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-white-bomb4" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
            </div>
            <div id="powerups-black">
               <div>
                  <img class="powerup-image-full" src="assets/images/players/black.png">
               </div>
               <div id="powerups-black-bomblength">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bomblength.png">
                  <br><span class="powerup-text">2</span>
               </div>
               <div id="powerups-black-bombtime">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bombtime.png">
                  <br><span class="powerup-text">4s</span>
               </div>
               <div id="powerups-black-speed">
                  <img class="powerup-image-up" src="assets/images/blocks/power_speed.png">
                  <br><span class="powerup-text">LOW</span>
               </div>
               <div id="powerups-black-kickbomb" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/power_kickbombs.png">
               </div>
               <div id="powerups-black-bomb1">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-black-bomb2" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-black-bomb3" style="visibility: hidden;">

               </div>
               <div id="powerups-black-bomb4" style="visibility: hidden;">

            </div>

               <div id="powerups-orange-bombtime">
                  <img class="powerup-image-up" src="assets/images/blocks/power_bombtime.png">
                  <br><span class="powerup-text">4s</span>
               </div>
               <div id="powerups-orange-speed">
                  <img class="powerup-image-up" src="assets/images/blocks/power_speed.png">

               </div>
               <div id="powerups-orange-kickbomb" style="visibility: hidden;">

               </div>
               <div id="powerups-orange-bomb1">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-orange-bomb2" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-orange-bomb3" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-orange-bomb4" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
            </div>
            <div id="powerups-green">
               <div>

               </div>
               <div id="powerups-green-bomblength">

               <div id="powerups-green-bombtime">

               <div id="powerups-green-speed">

               </div>

                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-green-bomb2" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-green-bomb3" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
               <div id="powerups-green-bomb4" style="visibility: hidden;">
                  <img class="powerup-image-small" src="assets/images/blocks/bomb.png">
               </div>
            </div>
         </div>
      </div>


      <div id="sidebar-middle">
         <canvas id="canvas" width="815" height="620"></canvas>
      </div>


      <div id="sidebar-right">
         <div id="start-game">
            <span id="room-status" style="color: red;"></span>
            <br>
            <button id="start-button">Start game</button>
         </div>

         <button id="button-up" class="android-button"> ^ </button>
         <br>
         <button id="button-left" class="android-button"> &#x003c; </button>
         <button id="button-bomb" class="android-button"> BOMB </button>
         <button id="button-right" class="android-button"> &#x003e; </button>
         <br>
         <button id="button-down" class="android-button"> v </button>
         <br>

         <ul id="player-list"></ul>
      </div>
   </div>

   {{ template "footer.html" . }}
</body>
</html>
